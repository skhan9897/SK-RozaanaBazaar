version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: skrozana-db
    restart: always
    environment:
      MYSQL_DATABASE: skrozana_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: skrozana-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:mysql://db:3306/skrozana_db
      - DB_USER=root
      - DB_PASSWORD=password

volumes:
  db_data:
